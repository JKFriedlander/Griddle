name: CI

on:
  push:
  pull_request:

jobs:
  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check all puzzle JSON files
        run: |
          failed=0
          for f in puzzles/*.json; do
            if python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "✓ $f"
            else
              echo "✗ $f (invalid JSON)"
              failed=1
            fi
          done
          exit $failed

  lint-python:
    name: Lint Python server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax
        run: python3 -m py_compile py/server.py && echo "✓ py/server.py"

      - name: Install Ruff
        run: pip install --quiet ruff

      - name: Run Ruff
        run: ruff check py/server.py

  check-js:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check syntax (node --check)
        run: |
          failed=0
          for f in js/*.js; do
            if node --check "$f" 2>&1; then
              echo "✓ $f"
            else
              failed=1
            fi
          done
          exit $failed
